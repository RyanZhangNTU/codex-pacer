name: Engine cache

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Which release engine to warm
        type: choice
        options: [x64, arm64, both]
        default: x64

permissions:
  contents: read

jobs:
  engine:
    name: Engine cache (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'both' && '["x64","arm64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    concurrency:
      group: engine-cache-${{ github.ref }}-${{ matrix.architecture }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/windows-engine
        with:
          architecture: ${{ matrix.architecture }}
          warm-only: 'true'
